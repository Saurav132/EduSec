spring.application.name=backend-test
server.port=8080

# Isolated SQLite Test Database
spring.datasource.url=jdbc:sqlite:target/test-data/edusec-test.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys = ON;

server.error.include-stacktrace=never
server.error.include-message=never

# Auto-detection disabled by default in test suite to preserve isolation of manual tests
edusec.detection.auto-enabled=false
edusec.detection.auto-interval-ms=5000

