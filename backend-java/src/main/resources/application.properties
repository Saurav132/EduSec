spring.application.name=backend
server.port=${PORT:8080}

# SQLite Database Configuration
spring.datasource.url=${EDUSEC_DB_URL:jdbc:sqlite:data/edusec.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys = ON;

# CORS Allowed Origins (Comma-delimited with safe localhost defaults)
edusec.cors.allowed-origins=${EDUSEC_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:3000,http://127.0.0.1:3000}

# Security & Error Response Hardening
server.error.include-stacktrace=never
server.error.include-message=never

# Request Size Limit Protection
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.tomcat.max-http-form-post-size=5MB

# Phase 9: Automatic SIEM Detection
edusec.detection.auto-enabled=${EDUSEC_DETECTION_AUTO_ENABLED:true}
edusec.detection.auto-interval-ms=${EDUSEC_DETECTION_AUTO_INTERVAL_MS:5000}

